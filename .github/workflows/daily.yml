name: daily-short

on:
  schedule:
    - cron: "30 4 * * *"   # 10:00 IST daily
  workflow_dispatch: {}

permissions:
  contents: write   # lets the job commit state/published.json

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: echo "matrix=$(python3 pipeline/channel.py)" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false   # one broken channel must not stop the others
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    concurrency: daily-short-${{ matrix.slug }}
    env:
      CHANNEL: ${{ matrix.slug }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets[matrix.secret] }}
    steps:
      - uses: actions/checkout@v4

      - name: "Read privacy level (private, unlisted or public) from the channel state"
        run: |
          D=$([ "$CHANNEL" = main ] && echo . || echo "channels/$CHANNEL")
          echo "PRIVACY=$(tr -d '[:space:]' < "$D/state/privacy" 2>/dev/null || echo private)" >> "$GITHUB_ENV"

      - name: Kill switch (global PAUSE or the channel own PAUSE)
        run: |
          D=$([ "$CHANNEL" = main ] && echo . || echo "channels/$CHANNEL")
          test ! -f state/PAUSE && test ! -f "$D/state/PAUSE" || (echo "paused"; exit 78)

      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Setup
        run: |
          sudo apt-get update -y && sudo apt-get install -y ffmpeg
          bash scripts/setup.sh
          pip install -q google-api-python-client google-auth

      - name: Pick next queued script
        id: pick
        run: |
          NEXT=$(python3 pipeline/next.py)
          echo "script=$NEXT" >> "$GITHUB_OUTPUT"

      - name: Build + QC
        if: steps.pick.outputs.script != ''
        run: bash scripts/make.sh "${{ steps.pick.outputs.script }}"

      - name: Upload to YouTube (only if secrets are set and QC passed)
        if: steps.pick.outputs.script != '' && env.YT_REFRESH_TOKEN != ''
        run: python3 pipeline/upload.py "${{ steps.pick.outputs.script }}"

      - name: Commit state
        if: steps.pick.outputs.script != '' && env.YT_REFRESH_TOKEN != ''
        run: |
          git config user.name "autochannel-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state/ channels/*/state/ 2>/dev/null || git add state/
          git diff --staged --quiet || git commit -m "state: ${{ matrix.slug }} published ${{ steps.pick.outputs.script }}"
          for i in 1 2 3 4 5; do git pull --rebase -q && git push && break; sleep $((RANDOM % 10 + 3)); done

      - name: Keep artifact
        if: steps.pick.outputs.script != ''
        uses: actions/upload-artifact@v4
        with:
          name: short-${{ matrix.slug }}
          path: out/*/final.mp4
